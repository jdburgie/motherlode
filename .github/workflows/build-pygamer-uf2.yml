name: Build PyGamer UF2

on:
  push:
    branches:
      - feature/sd-save-highscores
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Alire
        uses: alire-project/setup-alire@v6

      - name: Resolve pinned toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          alr --version | tee diagnostics/alire-version.txt
          alr update 2>&1 | tee diagnostics/alire-update.log
          alr printenv 2>&1 | tee diagnostics/alire-environment.log

      - name: Inventory ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            alr exec -- env
            alr exec -- sh -c 'ls -la "$GNAT_ARM_ELF_ALIRE_PREFIX/bin"'
            alr exec -- sh -c 'arm-eabi-gcc -v || true'
            alr exec -- sh -c 'arm-elf-gcc -v || true'
            alr exec -- sh -c 'arm-none-eabi-gcc -v || true'
            alr exec -- sh -c 'gprconfig --show-targets || true'
            alr exec -- sh -c 'find "$GNAT_ARM_ELF_ALIRE_PREFIX" -maxdepth 5 -type d | sort'
          } 2>&1 | tee diagnostics/toolchain-inventory.log

      - name: Build production firmware
        shell: bash
        run: |
          set -euo pipefail
          alr build -- -XMOTHERLODE_BUILD=Production -cargs:Ada -gnatX 2>&1 | tee diagnostics/build.log
          test -f obj_target/motherlode.elf

      - name: Convert ELF to UF2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          alr exec -- bash -lc '
            set -euo pipefail
            OBJCOPY="$(command -v arm-eabi-objcopy || command -v arm-none-eabi-objcopy || command -v arm-elf-objcopy)"
            echo "Using objcopy: ${OBJCOPY}"
            "${OBJCOPY}" -O binary obj_target/motherlode.elf dist/motherlode-sd-save-highscores.bin
          '

          curl --fail --location --silent --show-error \
            --output uf2conv.py \
            https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          curl --fail --location --silent --show-error \
            --output uf2families.json \
            https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json

          python3 uf2conv.py \
            -b 0x4000 \
            -c \
            -o dist/motherlode-sd-save-highscores.uf2 \
            dist/motherlode-sd-save-highscores.bin

          cp obj_target/motherlode.elf dist/motherlode-sd-save-highscores.elf
          sha256sum dist/* | tee dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: motherlode-sd-save-highscores-uf2
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motherlode-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
